<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Traceable IT — Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#030810;
  --bg2:#060e1e;
  --sidebar-bg:#04080f;
  --surface:rgba(10,22,50,0.8);
  --border:rgba(0,210,255,0.1);
  --accent:#00d2ff;
  --accent2:#0066ff;
  --accent3:#00ff9d;
  --danger:#ff3b5c;
  --warning:#ffb800;
  --text:#e8f4ff;
  --muted:#4a6a8a;
  --sidebar:240px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
}

/* APP LAYOUT */
.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar);
  background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

/* MAIN */
.main{
  flex:1;
  overflow-y:auto;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:14px 20px;
  position:sticky;
  top:0;
  background:rgba(3,8,16,0.95);
  backdrop-filter:blur(10px);
  z-index:10;
}

/* PAGES */
.page{display:none;padding:20px;}
.page.active{display:block;}

/* KPI GRID */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

/* CARDS */
.kpi-card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:16px;
  border-radius:12px;
}

/* CHARTS */
.charts-row{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  margin-top:16px;
}

.chart-card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:16px;
  border-radius:12px;
  overflow:hidden;
}

/* TABLE RESPONSIVE FIX */
.table-card{
  overflow-x:auto;
}

/* TABLE */
table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  font-size:13px;
  white-space:nowrap;
}

/* MOBILE MENU BUTTON */
.menu-btn{
  display:none;
  font-size:22px;
  cursor:pointer;
  background:none;
  border:none;
  color:var(--text);
}

/* MOBILE SIDEBAR */
@media(max-width:900px){

  .menu-btn{display:block;}

  .sidebar{
    position:fixed;
    left:-260px;
    top:0;
    height:100%;
    z-index:100;
    transition:0.3s;
  }

  .sidebar.open{
    left:0;
  }

  .kpi-grid{
    grid-template-columns:1fr 1fr;
  }

  .charts-row{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  .kpi-grid{
    grid-template-columns:1fr;
  }

  .page{padding:12px;}

  .topbar{
    padding:12px;
  }

  table{
    min-width:600px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div style="padding:20px;font-weight:bold;">TRACEABLE IT</div>

    <div style="padding:10px 20px;cursor:pointer;">Dashboard</div>
    <div style="padding:10px 20px;cursor:pointer;">Threats</div>
    <div style="padding:10px 20px;cursor:pointer;">Clients</div>
    <div style="padding:10px 20px;cursor:pointer;">Tickets</div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div>Dashboard</div>
      <div>🟢 Live</div>
    </div>

    <div class="page active">

      <!-- KPI -->
      <div class="kpi-grid">
        <div class="kpi-card">Threats: 2847</div>
        <div class="kpi-card">Clients: 143</div>
        <div class="kpi-card">Tickets: 7</div>
        <div class="kpi-card">Uptime: 99.9%</div>
      </div>

      <!-- CHARTS -->
      <div class="charts-row">
        <div class="chart-card">Chart Area</div>
        <div class="chart-card">Donut Chart</div>
      </div>

      <!-- TABLE -->
      <div class="chart-card" style="margin-top:16px;">
        <div class="table-card">
          <table>
            <tr>
              <th>Name</th><th>Company</th><th>Status</th>
            </tr>
            <tr>
              <td>Chidi</td><td>Zenith</td><td>New</td>
            </tr>
          </table>
        </div>
      </div>

    </div>

  </main>
</div>

<script>
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}
</script>

</body>
</html>
